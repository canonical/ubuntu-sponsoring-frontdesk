name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # archive_lookup.py imports apt_pkg (python3-apt), a compiled extension
      # tied to the system Python -- it isn't pip-installable, so this uses
      # the runner's system python3 rather than actions/setup-python's
      # isolated build (which wouldn't have it).
      #
      # NOT installed here: python3-ubuntu-lint (#109, checks.py's SRU
      # version-suffix check). It's a system package too, but its PPA has
      # no 24.04 build yet, so it can't be apt-installed on this runner --
      # present on the bot's own VM, absent here. checks.py imports it
      # defensively and the check fails safe (False, not blocking) when
      # it's missing; tests/test_sru_version_suffix_convention.py skips
      # outright via pytest.importorskip rather than failing here.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-apt python3-pip
          pip install --break-system-packages ruff==0.15.21 pytest pyyaml launchpadlib

      - name: Lint
        run: make lint

      - name: Test
        run: make test
