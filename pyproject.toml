# The [project] table describes the CHARM (src/), which charmcraft's uv
# plugin builds into a venv. The bot (usf/) is not a Python package and has
# no dependencies here: it runs on system python3 with distro packages, which
# the charm installs on the unit (#146). See the Makefile for the split.
[project]
name = "ubuntu-sponsoring-frontdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "charmlibs-apt~=1.0",
    "charmlibs-snap~=2.0",
    "charmlibs-systemd~=1.0",
    "ops~=3.8",
]

[project.optional-dependencies]
dev = [
    "ops[testing]",
    "pytest",
    "jubilant",
    # Same pin as the system ruff the bot's half uses (#108).
    "ruff==0.15.21",
]

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "I001"]
# C901 (mccabe complexity) is inherent to this codebase's decision-tree
# check functions -- flagged as noise here rather than a real code
# smell; see doc/design_journal.md for the backlog note on selective
# refactoring candidates instead of a blanket threshold.
lint.ignore = ["C901"]
extend-exclude = ["__pycache__", "*.egg_info", ".venv"]
# The bot's modules live in usf/ and import each other flat (`import
# checks`); without this, isort reads them as third-party and wants every
# import block rewritten. usf/tests/ is deliberately NOT listed: the test
# helpers (`from fakes import ...`) have always sorted as their own block,
# and adding it would merge them into the first-party block across 37 files
# for no benefit. src/ is the charm, whose modules import each other flat
# the same way (`from frontdesk import ...`).
src = ["usf", "src"]

[tool.ruff.lint.per-file-ignores]
# Fakes/doubles mirror launchpadlib's real camelCase method names
# (createComment, getPublishedSources, ...) -- renaming would decouple
# the test doubles from the API they simulate.
"usf/tests/*" = ["N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
